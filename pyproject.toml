[project]
name = "nasa-ads-mcp"
version = "0.4.0"
description = "MCP server for NASA Astrophysics Data System - search papers, track citations, export BibTeX"
# Credit is shared; accountability is the maintainer's (see "How This Was Made" in README)
authors = [
    {name = "Paula Coelho"},
    {name = "Claude (Anthropic)"},
]
maintainers = [
    {name = "Paula Coelho"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Pinned below 2.0: the 2.x SDK changed the server API this code uses
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/prtc/nasa-ads-mcp"
Repository = "https://github.com/prtc/nasa-ads-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_ads_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
